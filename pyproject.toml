[project]
name = "project-10"
version = "0.1.0"
description = "TP Flask + Poetry + Tailwind CSS"
requires-python = ">=3.10"
dependencies = ["flask (>=3.1.3,<4.0.0)", "openai (>=3.35.1,<4.0.0)", "python-dotenv (>=1.2.4,<2.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
